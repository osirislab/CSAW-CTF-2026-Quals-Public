name: csale

services:
  csale:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - "${CSALE_BIND:-0.0.0.0}:${CSALE_PORT:-5000}:5000"
    environment:
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY:?Set FLASK_SECRET_KEY in .env}"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
