services:

  static-page:
    build: ./phase0-static
    ports:
      - "8000:80"
    networks:
      - public

  load-balancer:
    build: ./loadbalancer
    ports:
      - "8081:8080"
    environment:
      REQUIRED_UA: "StationSync-Agent/2.1"
      STATION_URLS: "http://station-1:5000,http://station-2:5000,http://station-3:5000,http://station-4:5000"
    depends_on:
      - station-1
      - station-2
      - station-3
      - station-4
    networks:
      - public
      - internal

  station-1:
    build: ./station
    environment:
      STATION_ID: st-01
      TARGET_TIME: "2018-07-12T04:00:00-04:00"
      DEBUG_SEPARATOR: " "
    networks:
      - internal
    # no "ports:" - never reachable from outside the docker host, only the LB can reach it

  station-2:
    build: ./station
    environment:
      STATION_ID: st-02
      TARGET_TIME: "2015-06-10T09:00:00-07:00"
      DEBUG_SEPARATOR: "+"
    networks:
      - internal

  station-3:
    build: ./station
    environment:
      STATION_ID: st-03
      TARGET_TIME: "2016-08-20T15:00:00+02:00"
      DEBUG_SEPARATOR: "\t"
    networks:
      - internal

  station-4:
    build: ./station
    environment:
      STATION_ID: st-04
      TARGET_TIME: "2019-03-15T10:00:00-03:00"
      IS_RELAY_STATION: "true"
      ADMIN_RELAY_HOST: "10.10.14.31"
      RELAY_KEY: "4f9a-77c2-e01d"
      DEBUG_SEPARATOR: "|"
      ADMIN_RELAY_URL: "http://admin-relay:5000/control"
    networks:
      - internal
      - adminnet
    # station-4 is the ONLY station on adminnet - stations 1-3 have no
    # network path to admin-relay at all, not just an application-layer check

  admin-relay:
    build: ./admin-relay
    environment:
      FLAG: "CSAW{time_sensitive_scada_proxy_chain}"
    networks:
      - adminnet
    # no "ports:" - never reachable from the host or from any station
    # except station-4, which is the only other service on adminnet

networks:
  public:
  internal:
  adminnet:
