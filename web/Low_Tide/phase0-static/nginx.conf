server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # don't leak nginx version in headers/error pages
    server_tokens off;

    # only GET/HEAD are meaningful for a static site - reject everything else
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # no directory listings anywhere
    autoindex off;

    # block every dotfile by default (.git, .env, .DS_Store, editor swap files, etc.)
    # plain "return 404" only (not "deny all") - deny would short-circuit at the
    # access-control phase and return 403 before this ever executes, which would
    # confirm something's there but blocked; 404 gives nothing away
    location ~ /\. {
        return 404;
    }

    # the one deliberate exception: .htaccess is served as plain text, read-only
    # (exact-match location always wins over the regex block above, regardless of order)
    location = /.htaccess {
        default_type text/plain;
    }

    location = /robots.txt {
        default_type text/plain;
    }

    location /assets/ {
        default_type application/javascript;
        # no directory listing of /assets/ itself
        autoindex off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
